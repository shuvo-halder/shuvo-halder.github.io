<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Shuvo Halder</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 6rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: var(--shadow-accent);
    }
    .error-terminal {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      color: var(--text-secondary);
      max-width: 500px;
      width: 100%;
    }
    .error-terminal span {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header class="navbar" role="banner">
    <div class="container nav-container">
      <a href="/" class="brand-logo" aria-label="Shuvo Halder Portfolio Home">
        <span class="brand-prompt">&gt;</span>
        <span class="brand-name">shuvo.dev</span>
      </a>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Switch theme" title="Toggle theme">
          <svg class="theme-icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5" />
            <path stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
          <svg class="theme-icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <div class="container error-wrapper">
      <div class="error-code">404</div>
      <div class="error-terminal">
        <span>$</span> curl -I https://shuvo-halder.github.io/requested-path<br>
        <span style="color: #ef4444;">HTTP/2 404 Not Found</span> // Route does not exist
      </div>
      <p style="color: var(--text-secondary); margin-bottom: 2rem; max-width: 480px;">
        The requested endpoint or file could not be located in this cluster.
      </p>
      <a href="/" class="btn btn-primary">
        &larr; Return to Base
      </a>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container footer-content">
      <div class="footer-mono">&copy; 2026 Shuvo Halder. All rights reserved.</div>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
