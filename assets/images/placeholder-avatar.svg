<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="url(#accentGlow)"/>

  <!-- Tech Grid / Ring Accents -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Head / Face Silhouette -->
  <circle cx="100" cy="74" r="32" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="74" r="28" fill="#0f172a"/>

  <!-- Tech Monogram / Terminal in Silhouette -->
  <path d="M92 70 L98 75 L92 80" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="102" y1="80" x2="110" y2="80" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Shoulders / Torso -->
  <path d="M48 162 C48 126, 70 118, 100 118 C130 118, 152 126, 152 162 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <path d="M54 162 C54 132, 74 124, 100 124 C126 124, 146 132, 146 162 Z" fill="#0f172a"/>

  <!-- Cloud Node Connection Lines at base -->
  <circle cx="100" cy="138" r="4" fill="#06b6d4"/>
  <line x1="100" y1="138" x2="100" y2="152" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
